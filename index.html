<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방주의 문</title>
<meta name="description" content="노아의 방주 방탈출 · 선장실과 방 화면">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1317'/%3E%3Cpath d='M5 18h22l-3 6H8z' fill='%23caa45a'/%3E%3Cpath d='M10 18v-5h12v5' fill='%235a3d26'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Cinzel:wght@500;700&display=swap">
<style>
html{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: room screen is one centered column — a carved wooden door with a brass keypad over a night sea; the captain's cabin is a join bar over a two-column desk of controls and room cards. Single deliberate dark look. */
:root{
  --night:#0a1317; --sea:#11222a; --storm:#1a2f37;
  --pitch:#2a1c12; --wood:#5a3d26; --wood-hi:#7a5636;
  --brass:#caa45a; --brass-dim:#8f7440;
  --dove:#ece5d3; --mist:#9fb0b2;
  --olive:#a9bb6a; --ember:#d9694f;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Cinzel","Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--dove);font-family:var(--body);font-size:15px;overflow-x:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 110%,var(--sea) 0%,transparent 60%),radial-gradient(90% 60% at 50% -10%,var(--storm) 0%,transparent 70%)}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:28px;padding-inline:16px;box-sizing:border-box;gap:22px}
.eyebrow{font-family:var(--num);letter-spacing:.28em;font-size:12px;color:var(--brass);text-transform:uppercase;text-align:center}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,52px);margin:0;text-align:center;text-wrap:balance;letter-spacing:.02em}
.lede{color:var(--mist);margin:0;text-align:center;font-size:15px;line-height:1.6}
.head{display:flex;flex-direction:column;gap:8px;align-items:center}

/* the door */
.door{width:min(360px,100%);box-sizing:border-box;padding:26px 22px 24px;border-radius:18px 18px 10px 10px;position:relative;
  background:
    repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.28) 58px 60px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 3px,transparent 3px 9px),
    linear-gradient(180deg,var(--wood-hi),var(--wood) 40%,var(--pitch));
  box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:20px}
.door::before,.door::after{content:"";position:absolute;left:14px;right:14px;height:6px;border-radius:3px;background:linear-gradient(180deg,var(--brass),var(--brass-dim));opacity:.8}
.door::before{top:10px}.door::after{bottom:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.slot{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--pitch);box-shadow:inset 0 4px 10px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.08);
  display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:clamp(30px,9vw,40px);color:var(--brass);font-variant-numeric:tabular-nums;transition:color .2s,box-shadow .2s}
.slot.on{box-shadow:inset 0 4px 10px rgba(0,0,0,.7),0 0 0 1px var(--brass-dim)}
.slot.cur{box-shadow:inset 0 4px 10px rgba(0,0,0,.7),0 0 0 2px var(--brass)}
.slots.bad .slot{color:var(--ember);box-shadow:inset 0 4px 10px rgba(0,0,0,.7),0 0 0 2px var(--ember)}
.slots.bad{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{font:inherit;font-family:var(--num);font-size:24px;font-weight:500;color:var(--pitch);border:0;border-radius:50%;aspect-ratio:1;max-width:76px;width:100%;justify-self:center;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#f0d89a,var(--brass) 45%,var(--brass-dim));
  box-shadow:0 4px 0 #5e4a26,0 8px 14px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.key:active,.key.press{transform:translateY(3px);box-shadow:0 1px 0 #5e4a26,0 3px 6px rgba(0,0,0,.45)}
.key:focus-visible,.btn:focus-visible,.link:focus-visible,input:focus-visible{outline:2px solid var(--dove);outline-offset:3px}
.key.ghost{background:transparent;color:var(--dove);box-shadow:none;font-family:var(--body);font-size:14px;border:1px solid rgba(236,229,211,.25)}
.key.go{font-family:var(--body);font-size:15px;font-weight:700;background:radial-gradient(circle at 35% 30%,#d7e2a2,var(--olive) 50%,#6e7c3d);box-shadow:0 4px 0 #4b5528,0 8px 14px rgba(0,0,0,.45)}
.key:disabled{opacity:.35;cursor:not-allowed}
.msg{min-height:1.5em;text-align:center;font-size:14px;color:var(--mist);margin:0}
.msg.bad{color:var(--ember)}
.foot{font-family:var(--num);font-size:11px;letter-spacing:.18em;color:var(--brass-dim);text-align:center;line-height:1.8}
.foot span{font-family:var(--body);letter-spacing:.04em}

/* opened */
.open{position:fixed;inset:0;z-index:5;overflow:hidden;background:var(--night)}
#bow{position:absolute;inset:0;width:100%;height:100%;display:block}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.28) 58px 60px),linear-gradient(180deg,var(--wood-hi),var(--wood) 40%,var(--pitch));animation:swingL 1.6s cubic-bezier(.6,0,.2,1) .2s forwards;z-index:3;box-shadow:0 0 40px rgba(0,0,0,.6)}
.leaf.r{right:0;animation-name:swingR}.leaf.l{left:0}
@keyframes swingL{to{transform:translateX(-101%)}}@keyframes swingR{to{transform:translateX(101%)}}
.reveal{position:absolute;left:16px;right:16px;bottom:calc(7vh + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;opacity:0;animation:rise 1.4s ease 3.4s forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal h2{font-family:var(--display);font-size:clamp(34px,8vw,56px);margin:0;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.reveal p{margin:0;color:var(--dove);opacity:.85;line-height:1.6;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.dove{position:absolute;z-index:2;left:0;top:0;width:clamp(44px,8vw,72px);opacity:0;animation:fly 7s cubic-bezier(.35,0,.3,1) 2.6s forwards}
.dove .w{transform-origin:22px 18px;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.55)}}
@keyframes fly{0%{opacity:0;transform:translate(-12vw,62vh) scale(.6)}12%{opacity:1}60%{transform:translate(44vw,22vh) scale(1)}100%{opacity:1;transform:translate(46vw,18vh) scale(1)}}
.dove.rest .w{animation:none}
/* cooldown */
.ebb{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.ebb i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),#e39a52);animation:ebb linear forwards;transform-origin:left}
@keyframes ebb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.door.locked .slot{color:var(--brass-dim)}

/* captain's cabin (admin) */
.cabin{width:min(460px,100%);display:flex;flex-direction:column;gap:18px}
.card{background:rgba(26,47,55,.82);border:1px solid rgba(202,164,90,.25);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px)}
.card h3{margin:0;font-family:var(--display);font-size:20px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dashed rgba(159,176,178,.2);padding-bottom:8px}
.row:last-child{border-bottom:0;padding-bottom:0}
.row b{font-weight:400;color:var(--mist)}
.row span{font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px}
.pill.ok{background:rgba(169,187,106,.18);color:var(--olive)}
.pill.no{background:rgba(217,105,79,.18);color:var(--ember)}
label{font-size:13px;color:var(--mist)}
.codein{font-family:var(--num);font-size:34px;letter-spacing:.5em;text-align:center;width:100%;box-sizing:border-box;padding:12px 0 12px .5em;border-radius:10px;border:1px solid var(--brass-dim);background:var(--pitch);color:var(--brass)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--brass);color:var(--pitch)}
.btn.sec{background:transparent;color:var(--dove);border:1px solid rgba(236,229,211,.3);font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.note{font-size:13px;color:var(--mist);line-height:1.6;margin:0}
.note.bad{color:var(--ember)}.note.ok{color:var(--olive)}
.link{font:inherit;background:none;border:0;color:var(--brass);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.corner{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;font-size:13px;background:rgba(10,19,23,.75);border:1px solid rgba(202,164,90,.35);border-radius:99px;padding:6px 14px}
.corner.left{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
.limin{font-family:var(--num);font-size:22px;text-align:center;width:100%;box-sizing:border-box;padding:10px 0;border-radius:10px;border:1px solid var(--brass-dim);background:var(--pitch);color:var(--brass)}
.field{display:flex;flex-direction:column;gap:8px}
.fields{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media (max-width:420px){.fields{grid-template-columns:1fr}}

/* the clock and rising tension */
.clock{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 22px 10px;border-radius:12px;background:rgba(10,19,23,.6);border:1px solid rgba(202,164,90,.35);transition:border-color .6s}
.clock .t{font-family:var(--num);font-weight:700;font-size:clamp(30px,8vw,42px);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--brass);transition:color .6s}
.clock .lbl{font-size:11px;letter-spacing:.2em;color:var(--mist)}
body.warn .clock .t{color:#e39a52}
body.urgent .clock{border-color:var(--ember);animation:pulse 1s infinite}
body.urgent .clock .t{color:var(--ember)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,105,79,.55)}70%{box-shadow:0 0 0 16px rgba(217,105,79,0)}100%{box-shadow:0 0 0 0 rgba(217,105,79,0)}}
body.final .clock .t{animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.14)}}
body.final .door{animation:rattle .45s infinite}
@keyframes rattle{0%,100%{transform:none}25%{transform:translate(1.5px,-1px) rotate(.25deg)}75%{transform:translate(-1.5px,1px) rotate(-.25deg)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 20vmin rgba(150,25,15,.6);opacity:0;transition:opacity 1.2s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:9;background:#e6efff;opacity:0}
.drown{position:fixed;inset:0;z-index:5;overflow:hidden;background:var(--night);display:grid;place-items:center;padding-inline:16px}
.drown .water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,rgba(60,120,140,.95),#08161c 40%);animation:flood 2.8s cubic-bezier(.3,0,.2,1) forwards}
.drown .water::before{content:"";position:absolute;left:-10%;right:-10%;top:-14px;height:28px;border-radius:50%;background:rgba(160,200,210,.35);filter:blur(4px)}
@keyframes flood{to{height:100%}}
.drown .txt{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;gap:12px;opacity:0;animation:rise 1.2s ease 2.2s forwards}
.drown h2{font-family:var(--display);font-size:clamp(34px,8vw,54px);margin:0}
.drown p{margin:0;color:var(--mist);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/* ---------- live game: hint, waiting lamp, countdown, gate ---------- */
.hint{width:min(420px,100%);box-sizing:border-box;padding:12px 16px;border-radius:12px;background:rgba(202,164,90,.12);border:1px solid rgba(202,164,90,.45);display:flex;flex-direction:column;gap:4px}
.hint b{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--brass);font-weight:500}
.hint p{margin:0;font-family:var(--display);font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.hint.fresh{animation:glow 2.6s ease}
@keyframes glow{20%{box-shadow:0 0 0 6px rgba(202,164,90,.4),0 0 44px rgba(202,164,90,.55)}100%{box-shadow:0 0 0 0 rgba(202,164,90,0)}}
.wait{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:30px;text-align:center}
.wait p{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.2em;color:var(--brass)}
.wait small{color:var(--mist);font-size:13px;line-height:1.6}
.lamp{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#ffe7a8,var(--brass) 60%,transparent 72%);box-shadow:0 0 26px 6px rgba(202,164,90,.45);animation:lamp 2.6s ease-in-out infinite}
@keyframes lamp{50%{opacity:.45;box-shadow:0 0 10px 2px rgba(202,164,90,.25)}}
.halt{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-6deg);padding:8px 18px;border:2px solid var(--ember);color:var(--ember);font-family:var(--display);font-weight:700;font-size:22px;background:rgba(10,19,23,.88);border-radius:6px;letter-spacing:.12em;white-space:nowrap;z-index:2}
.count{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 50%,rgba(26,47,55,.9),rgba(6,12,15,.97));text-align:center;padding-inline:16px}
.count .in{display:flex;flex-direction:column;align-items:center;gap:10px}
.count .n{font-family:var(--num);font-weight:700;font-size:min(34vmin,240px);line-height:1;color:var(--brass);text-shadow:0 0 60px rgba(202,164,90,.45);animation:pop .9s ease-out}
.count p{margin:0;font-family:var(--display);font-size:clamp(20px,4.5vw,30px);letter-spacing:.2em}
@keyframes pop{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.gate{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(6,12,15,.93);padding-inline:16px;cursor:pointer}
.gate .in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:420px}
.gate h2{margin:0;font-family:var(--display);font-size:clamp(28px,6vw,40px)}
.gate p{margin:0;color:var(--mist);line-height:1.6}

/* ---------- captain's console ---------- */
.desk{width:min(1060px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.desk{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bigclock{font-family:var(--num);font-weight:700;font-size:clamp(46px,9vw,68px);color:var(--brass);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.05}
.pill.run{background:rgba(169,187,106,.18);color:var(--olive)}
.pill.wait{background:rgba(202,164,90,.18);color:var(--brass)}
.pill.stop{background:rgba(217,105,79,.18);color:var(--ember)}
.pill.idle{background:rgba(159,176,178,.15);color:var(--mist)}
.btn.big{font-size:18px;padding:18px}
.btn.warnb{background:transparent;border:1px solid var(--ember);color:var(--ember);font-weight:400}
.btn.armed{background:var(--ember);color:var(--night);font-weight:700}
.hintin{font:inherit;font-family:var(--display);font-size:16px;line-height:1.5;width:100%;box-sizing:border-box;min-height:84px;padding:10px 12px;border-radius:10px;border:1px solid var(--brass-dim);background:var(--pitch);color:var(--dove);resize:vertical}
.screens{display:flex;flex-direction:column;gap:10px}
.screen{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:10px;background:rgba(10,19,23,.5);border:1px solid rgba(159,176,178,.18)}
.screen .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.screen .nm{font-family:var(--display);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(159,176,178,.14);color:var(--mist);white-space:nowrap}
.chip.ok{background:rgba(169,187,106,.18);color:var(--olive)}
.chip.warn{background:rgba(217,105,79,.18);color:var(--ember)}
.chip.gold{background:rgba(202,164,90,.18);color:var(--brass)}
.mini{display:flex;gap:6px;align-items:center}
.mini span{width:30px;height:38px;border-radius:6px;background:var(--pitch);display:grid;place-items:center;font-family:var(--num);font-weight:700;color:var(--brass);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.guesses{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mist)}
.guess{font-family:var(--num);font-size:14px;color:var(--ember);text-decoration:line-through;letter-spacing:.1em}
.tablewrap{overflow-x:auto}
.log{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.log th{text-align:left;font-weight:400;color:var(--mist);font-size:12px;padding:6px 6px;border-bottom:1px solid rgba(159,176,178,.25);white-space:nowrap}
.log td{padding:8px 6px;border-bottom:1px dashed rgba(159,176,178,.15);white-space:nowrap}
.empty{color:var(--mist);font-size:14px;line-height:1.6;margin:0}
.cabin-foot{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.choose{width:min(680px,100%);display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.choose{grid-template-columns:1fr}}
.pick{font:inherit;text-align:left;cursor:pointer;color:var(--dove);background:rgba(26,47,55,.82);border:1px solid rgba(202,164,90,.25);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px}
.pick:hover{border-color:var(--brass)}
.pick b{font-family:var(--display);font-size:22px}
.pick span{color:var(--mist);line-height:1.55;font-size:14px}
.pick:focus-visible{outline:2px solid var(--dove);outline-offset:3px}

/* ---------- live game: hint, waiting lamp, countdown, gate ---------- */
.hint{width:min(420px,100%);box-sizing:border-box;padding:12px 16px;border-radius:12px;background:rgba(202,164,90,.12);border:1px solid rgba(202,164,90,.45);display:flex;flex-direction:column;gap:4px}
.hint b{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--brass);font-weight:500}
.hint p{margin:0;font-family:var(--display);font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.hint.fresh{animation:glow 2.6s ease}
@keyframes glow{20%{box-shadow:0 0 0 6px rgba(202,164,90,.4),0 0 44px rgba(202,164,90,.55)}100%{box-shadow:0 0 0 0 rgba(202,164,90,0)}}
.wait{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:30px;text-align:center}
.wait p{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.2em;color:var(--brass)}
.wait small{color:var(--mist);font-size:13px;line-height:1.6}
.lamp{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#ffe7a8,var(--brass) 60%,transparent 72%);box-shadow:0 0 26px 6px rgba(202,164,90,.45);animation:lamp 2.6s ease-in-out infinite}

  function drawBow(cv){
    var g=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W,H,cx,cy,R,t0=performance.now();

    // primary bow, inner edge (violet) → outer edge (red)
    var SPEC=[[120,70,190],[70,90,220],[60,170,220],[110,200,120],[245,225,90],[245,150,60],[225,60,60]];
    var motes=[],clouds=[];
    function fit(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;cx=W/2;cy=H*.64;R=Math.min(W*.47,H*.56)}
    fit();addEventListener('resize',fit);
    for(var i=0;i<14;i++)clouds.push({x:Math.random(),y:Math.random()*.42,s:.6+Math.random()*.9,d:i%2?1:-1});
    function ease(x){x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
    function mix(a,b,k){return a.map(function(v,i){return Math.round(v+(b[i]-v)*k)})}

      var gr=g.createRadialGradient(cx,cy,r-w,cx,cy,r+w*.15),n=SPEC.length;
      gr.addColorStop(0,'rgba(0,0,0,0)');
      SPEC.forEach(function(c,i){var k=(i+.5)/n,col=rev?SPEC[n-1-i]:c;gr.addColorStop(.1+k*.8,rgb(col,alpha*(1-Math.pow(2*k-1,6)*.5)))});
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.save();g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,r+w,Math.PI,Math.PI+Math.PI*sweep);g.closePath();g.clip();
      g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r+w*.15,Math.PI,2*Math.PI);g.arc(cx,cy,r-w,2*Math.PI,Math.PI,true);g.fill();g.restore();
    }

      // sky: storm → washed dawn
      var sky=g.createLinearGradient(0,0,0,cy);
      sky.addColorStop(0,rgb(mix([10,19,23],[38,74,104],dawn),1));
      sky.addColorStop(.6,rgb(mix([17,34,42],[96,138,160],dawn),1));
      sky.addColorStop(1,rgb(mix([26,47,55],[244,206,160],dawn),1));
      g.fillStyle=sky;g.fillRect(0,0,W,cy+1);
      // sun glow behind the viewer's shoulder lights the lower sky
      var sun=g.createRadialGradient(cx,cy,0,cx,cy,R*1.6);
      sun.addColorStop(0,'rgba(255,236,200,'+(.35*dawn)+')');sun.addColorStop(1,'rgba(255,236,200,0)');
      g.fillStyle=sun;g.fillRect(0,0,W,cy);
      // slow light rays
      g.save();g.globalCompositeOperation='lighter';
      for(var k=0;k<9;k++){var a=Math.PI+(k+.5)/9*Math.PI+Math.sin(t*.15+k)*.04;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,Math.max(W,H),a-.035,a+.035);g.closePath();g.fillStyle='rgba(255,240,210,'+(.035*dawn)+')';g.fill()}
      g.restore();
      // sky inside the bow is brighter, the band between bows darker (Alexander's band)
      if(sweep>0){
        var inn=g.createRadialGradient(cx,cy,0,cx,cy,R*.86);inn.addColorStop(0,'rgba(255,255,255,0)');inn.addColorStop(.8,'rgba(255,250,240,'+(.10*sweep)+')');inn.addColorStop(1,'rgba(255,250,240,0)');
        g.fillStyle=inn;g.beginPath();g.arc(cx,cy,R*.86,Math.PI,2*Math.PI);g.fill();
        g.fillStyle='rgba(10,20,30,'+(.10*sweep)+')';g.beginPath();g.arc(cx,cy,R*1.27,Math.PI,2*Math.PI);g.arc(cx,cy,R*1.02,2*Math.PI,Math.PI,true);g.fill();
      }

      band(R,w*1.6,.35*glow,false,sweep);
      if('filter' in g)g.filter='none';
      band(R*.985,w*.7,.25*shimmer,false,sweep);
      g.restore();
      // clouds parting
      clouds.forEach(function(c){
        var px=(c.x*W)+c.d*W*.7*ease((t-.4)/3.2), py=c.y*cy, rr=c.s*Math.min(W,H)*.22;
        var cg=g.createRadialGradient(px,py,0,px,py,rr);var tone=mix([20,32,38],[150,160,170],dawn);
        cg.addColorStop(0,rgb(tone,.85));cg.addColorStop(1,rgb(tone,0));g.fillStyle=cg;g.fillRect(px-rr,py-rr,rr*2,rr*2);
      });
      // sea
      var sea=g.createLinearGradient(0,cy,0,H);
      sea.addColorStop(0,rgb(mix([22,40,48],[70,110,128],dawn),1));sea.addColorStop(1,rgb([8,16,20],1));
      g.fillStyle=sea;g.fillRect(0,cy,W,H-cy);

      g.save();g.beginPath();g.rect(0,cy,W,H-cy);g.clip();g.translate(0,2*cy);g.scale(1,-1);
      g.globalAlpha=.22;g.globalCompositeOperation='screen';if('filter' in g)g.filter='blur('+(10*dpr)+'px)';
      band(R,w,.9,false,sweep);
      g.restore();

      g.fillStyle='rgba(255,240,210,'+(.5*dawn)+')';
      for(var j=0;j<40;j++){var gx=(j*97.3%1)*W+((j*53)%7)*Math.sin(t+j)*6*dpr,gy=cy+Math.pow((j*.618)%1,1.8)*(H-cy),gl=(2+((j*31)%5))*dpr*(1+(gy-cy)/(H-cy)*3);
        g.globalAlpha=.3+.7*Math.max(0,Math.sin(t*2+j*1.7));g.fillRect(gx,gy,gl*4,dpr)}
      g.globalAlpha=1;
      // drops of light shed from the leading edge while the bow draws
      if(!still&&sweep>0&&sweep<1){var a2=Math.PI+Math.PI*sweep;for(var q=0;q<3;q++)motes.push({x:cx+Math.cos(a2)*(R+(Math.random()-.5)*w),y:cy+Math.sin(a2)*(R+(Math.random()-.5)*w),vx:(Math.random()-.5)*.6*dpr,vy:(Math.random()*.5+.2)*dpr,life:1,c:SPEC[(Math.random()*7)|0]})}

      motes=motes.filter(function(m){m.x+=m.vx;m.y+=m.vy;m.life-=.012;if(m.life<=0||m.y>cy)return false;

      g.restore();
      if(!still&&role==='room'&&lastPhase==='solved')bowRaf=requestAnimationFrame(frame);
    }
    if(still){frame(t0);var d=document.querySelector('.dove');if(d)d.classList.add('rest')}
    else bowRaf=requestAnimationFrame(frame);
  }


  // the room's little lamp: is the cabin still listening?
  var lamp=null;

  }
  function onHostMsg(m){

  function onPhase(prev,ph){
    if(ph==='intro'&&prev!=='intro')duck(true);
    if(prev==='intro'&&ph!=='intro')duck(false);
    if(ph==='go'&&prev!=='go'){flash=1.3;sfx.mega();quake()}
    if((prev==='countdown'||prev==='intro'||prev==='go')&&ph==='running'){sfx.slam();if(prev!=='go')strike(.9)}
    if(prev&&prev!=='solved'&&ph==='solved'&&!R.solved)sfx.win();
    if(prev==='running'&&ph==='timeout'){strike(1);sfx.drown()}
    if(prev&&prev!=='paused'&&ph==='paused'&&live())sfx.thump(AC.currentTime,90,.5);
  }
  function retry(ms){clearTimeout(retryT);retryT=setTimeout(connectHost,ms)}
  function roomNet(){
    if(!hasPeer){linkState='lost';updLink();return}
    try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
    peer=new Peer({debug:0});
    peer.on('open',function(){connectHost()});
    peer.on('disconnected',function(){setTimeout(function(){if(peer&&!peer.destroyed&&peer.disconnected)try{peer.reconnect()}catch(e){}},2000)});
    peer.on('error',function(e){
      if(e&&e.type==='peer-unavailable'){if(linkState!=='lost')linkState=S?'lost':'nohost';updLink();if(!S)renderRoom();retry(4000);return}
      if(peer&&peer.destroyed){linkState='lost';updLink();setTimeout(roomNet,5000)}
    });
  }
  function connectHost(){
    if(!peer||peer.destroyed){roomNet();return}
    if(peer.disconnected){retry(3000);return}
    var c=peer.connect(PREFIX+GAME,{serialization:'json',reliable:true});conn=c;
    c.on('open',function(){if(conn!==c)return;linkState='ok';lastHostMsg=Date.now();updLink();try{c.send({t:'hello',room:ROOM})}catch(e){}sendStatus()});
    c.on('data',function(m){if(conn===c)onHostMsg(m)});
    c.on('close',function(){if(conn!==c)return;conn=null;linkState='lost';updLink();retry(3000)});
    c.on('error',noop);
    setTimeout(function(){if(conn===c&&!c.open){try{c.close()}catch(e){}conn=null;retry(1000)}},10000);
  }
  function startRoom(){
    var saved=lsj('ark-room-state-'+GAME+'-'+ROOM);
    if(saved&&saved.S){S=saved.S;offset=+saved.offset||0}
    loadR();renderRoom();updLink();updGate();roomNet();
    setInterval(function(){
      sendStatus();
      if(linkState==='ok'&&Date.now()-lastHostMsg>15000&&conn){try{conn.close()}catch(e){}conn=null;linkState='lost';updLink();retry(500)}

  }

  /* =====================================================================
     CAPTAIN'S CABIN — the host: holds the code and drives every room

  var G=null,hpeer=null,conns={},netState='connecting',ctlKey='',roomsKey='',adminNote=null,endArm=0,newArm=0,showQR=false;
  function loadG(){
    G=lsj('ark-host');
    if(!G||!G.id)G={id:newId(),round:0,rooms:3,names:['','','','','',''],code:'',salt:'',hash:'',limit:900,intro:true,status:'idle',startAt:0,introAt:0,pausedAt:0,endReason:'',hints:{},results:{}};
    if(G.intro===undefined)G.intro=true;if(!G.introAt)G.introAt=0;

  }

    var L=G.limit*1000;if(!L)return Infinity;
    if(G.status==='ready'||G.status==='idle')return L;
    if(G.status==='paused')return Math.min(L,G.startAt+L-G.pausedAt);
    if(G.status==='running')return Math.min(L,G.startAt+L-Date.now());

  }

    return G.status;
  }
  function nameOf(r){return (G.names[r-1]||'').trim()||r+'번 방'}
  function statePayload(r){

      hint:G.hints[r]||null,name:nameOf(r),result:G.results[r]||null};
  }
  function sendTo(e){if(e.conn.open&&e.room)try{e.conn.send(statePayload(e.room))}catch(x){}}
  function broadcast(){Object.keys(conns).forEach(function(k){sendTo(conns[k])})}
  function commit(){saveG();broadcast();updHost()}
  function roomConns(r){var a=[],t=Date.now();Object.keys(conns).forEach(function(k){var e=conns[k];if(e.room===r&&e.conn.open&&t-e.last<15000)a.push(e)});return a}
  function bestStatus(r){var b=null;roomConns(r).forEach(function(e){if(e.st&&(!b||(e.st.solved&&!b.solved)||e.st.tries>b.tries))b=e.st});return b}
  function onRoomMsg(c,m){
    if(!m||typeof m!=='object')return;
    var e=conns[c.peer]||(conns[c.peer]={conn:c,room:0,last:0,st:null});
    e.last=Date.now();
    if(m.room)e.room=clampRoom(m.room);
    if(m.t==='hello')sendTo(e);
    if(m.t==='status'&&e.room){
      e.st={round:+m.round||0,phase:String(m.phase||''),tries:+m.tries||0,entry:String(m.entry||'').replace(/\D/g,'').slice(0,4),
        guesses:(Array.isArray(m.guesses)?m.guesses:[]).slice(-6).map(function(g){return String(g).replace(/\D/g,'').slice(0,4)}),armed:!!m.armed,solved:!!m.solved,rem:typeof m.rem==='number'?m.rem:null};
      if(e.st.solved&&e.st.round===G.round&&(G.status==='running'||G.status==='paused')&&!G.results[e.room]){
        G.results[e.room]={kind:'solved',remaining:G.limit?Math.max(0,Math.round(e.st.rem!=null?e.st.rem:hRemaining())):0,tries:e.st.tries,at:Date.now()};
        checkAllDone();commit();return;
      }
    }
    updRoomCard(e.room);
  }
  function checkAllDone(){
    if(G.status!=='running'&&G.status!=='paused')return;
    for(var r=1;r<=G.rooms;r++)if(!G.results[r])return;
    G.status='ended';G.endReason='all';
  }
  function closeOut(kind){
    var rem=hRemaining();
    for(var r=1;r<=G.rooms;r++)if(!G.results[r]){var b=bestStatus(r);G.results[r]={kind:kind,remaining:kind==='timeout'?0:(rem===Infinity?0:Math.max(0,Math.round(rem))),tries:b?b.tries:0,at:Date.now()}}
  }
  var hostRetry=null;
  function hostNet(){
    if(!hasPeer){netState='offline';updNet();return}
    clearTimeout(hostRetry);
    try{if(hpeer&&!hpeer.destroyed)hpeer.destroy()}catch(e){}
    netState='connecting';updNet();
    var p=hpeer=new Peer(PREFIX+G.id,{debug:0});
    p.on('open',function(){if(hpeer!==p)return;netState='online';updNet()});
    p.on('connection',function(c){
      c.on('open',function(){conns[c.peer]=conns[c.peer]||{conn:c,room:0,last:Date.now(),st:null};conns[c.peer].conn=c;conns[c.peer].last=Date.now()});
      c.on('data',function(m){onRoomMsg(c,m)});
      c.on('close',function(){var e=conns[c.peer];delete conns[c.peer];if(e&&e.room)updRoomCard(e.room)});
      c.on('error',noop);
    });
    p.on('disconnected',function(){if(hpeer!==p)return;netState='reconnecting';updNet();setTimeout(function(){if(hpeer===p&&!p.destroyed&&p.disconnected)try{p.reconnect()}catch(e){}},2000)});
    p.on('error',function(e){
      if(hpeer!==p)return;
      if(e&&e.type==='unavailable-id'){netState='taken';updNet();try{p.destroy()}catch(x){}hostRetry=setTimeout(hostNet,6000);return}
      if(p.destroyed){netState='reconnecting';updNet();hostRetry=setTimeout(hostNet,5000)}
    });
  }

  function updRoomCard(r){
    if(!r||!document.getElementById('rs-'+r))return;
    var cs=roomConns(r),st=bestStatus(r),res=G.results[r],live=G.round&&(G.status==='ready'||G.status==='running'||G.status==='paused');
    var ph=res?(res.kind==='solved'?'solved':res.kind==='timeout'?'timeout':'ended'):st&&st.round===G.round?st.phase:'';
    var p=PH[ph];
    document.getElementById('rs-'+r).innerHTML='<span class="chip '+(cs.length?'ok':'warn')+'">'+(cs.length?'연결됨'+(cs.length>1?' '+cs.length+'대':''):'연결 안 됨')+'</span>'+
      (p&&cs.length?'<span class="chip '+(p[1]==='run'?'ok':p[1]==='stop'?'warn':'gold')+'">'+p[0]+'</span>':'')+
      (cs.length&&st&&!st.armed?'<span class="chip warn">화면 켜기 전</span>':'')+
      (st&&st.round===G.round?'<span class="chip">시도 '+st.tries+'회</span>':'');
    var e=st&&st.round===G.round?st.entry:'',mini='';for(var i=0;i<4;i++)mini+='<span>'+esc(e[i]||'')+'</span>';
    document.getElementById('re-'+r).innerHTML=mini;
    var gs=st&&st.round===G.round?st.guesses:[];
    document.getElementById('rg-'+r).innerHTML=gs.length?'틀린 코드 '+gs.map(function(g){return '<span class="guess">'+esc(g)+'</span>'}).join(''):'';
    var rr=document.getElementById('rr-'+r);
    rr.className='res'+(res&&res.kind!=='solved'?' bad':'');
    rr.textContent=res?(res.kind==='solved'?'탈출 성공'+(G.limit?' · '+mmss(res.remaining)+' 남김':''):res.kind==='timeout'?'시간 초과':'종료'):'';
    var hn=G.hints[r];
    document.getElementById('rh-'+r).textContent=hn?'방 화면에 떠 있는 힌트: '+hn.text:(live?'떠 있는 힌트 없음':'항해를 준비하면 힌트를 보낼 수 있습니다.');
    document.querySelectorAll('[data-hint="'+r+'"],[data-unhint="'+r+'"]').forEach(function(b){b.disabled=!live});
  }
  function updRank(){
    var el=document.getElementById('h-rank');if(!el)return;
    var rows=[];for(var r=1;r<=G.rooms;r++)if(G.results[r])rows.push({r:r,x:G.results[r]});
    if(!G.round||!rows.length){el.hidden=true;return}
    el.hidden=false;
    rows.sort(function(a,b){var sa=a.x.kind==='solved'?1:0,sb=b.x.kind==='solved'?1:0;if(sa!==sb)return sb-sa;if(a.x.remaining!==b.x.remaining)return b.x.remaining-a.x.remaining;return a.x.tries-b.x.tries});
    el.innerHTML='<h3>'+G.round+'회차 결과</h3><ol class="rank">'+rows.map(function(o,i){
      return '<li><span class="no">'+(o.x.kind==='solved'?i+1:'—')+'</span><span>'+esc(nameOf(o.r))+' <span class="chip '+(o.x.kind==='solved'?'ok':'warn')+'">'+(o.x.kind==='solved'?'탈출':o.x.kind==='timeout'?'시간 초과':'종료')+'</span></span><span class="tm">'+(o.x.kind==='solved'&&G.limit?mmss(o.x.remaining)+' 남김':'')+' · '+o.x.tries+'회</span></li>'}).join('')+'</ol>';

  function prepare(){
    var c=document.getElementById('code').value,lv=document.getElementById('lim').value.trim(),lim=lv===''?0:Math.round(+lv),n=+document.getElementById('nrooms').value;
    if(!/^\d{4}$/.test(c)){adminNote=['bad','코드는 숫자 4자리로 입력하세요.'];updNote();document.getElementById('code').focus();return}
    if(!(lim>=0&&lim<=180)){adminNote=['bad','제한시간은 0에서 180분 사이로 입력하세요.'];updNote();return}
    var names=[].map.call(document.querySelectorAll('.names input'),function(x){return x.value.trim().slice(0,20)});
    var salt=Math.random().toString(36).slice(2,10),editing=G.status==='ready';
    G.round=editing?G.round:G.round+1;G.code=c;G.salt=salt;G.hash=hash(salt+c);G.limit=lim*60;G.rooms=clampRoom(n)||3;G.names=names;
    G.intro=document.getElementById('introchk').checked;
    G.status='ready';G.startAt=0;G.introAt=0;G.pausedAt=0;G.endReason='';G.hints={};G.results={};
    adminNote=['ok',G.round+'회차를 준비했습니다. 방 화면에 “방주 앞 대기”가 떴습니다.'];commit();
  }
  app.addEventListener('click',function(e){
    if(role!=='host')return;
    var cp=e.target.closest('[data-copy]');
    if(cp){var u=link(+cp.getAttribute('data-copy'));(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){cp.textContent='복사됨';setTimeout(function(){cp.textContent='링크 복사'},1500)},function(){cp.textContent='직접 선택해 복사하세요'});return}

    var ub=e.target.closest('[data-unhint]');
    if(ub){delete G.hints[+ub.getAttribute('data-unhint')];commit();return}
    var a=e.target.closest('[data-h]');if(!a||a.disabled)return;
    var act=a.getAttribute('data-h'),t0=Date.now();
    if(act==='qr'){showQR=!showQR;updJoin();return}
    if(act==='edit'){G.status='idle';ctlKey='';adminNote=null;G.round=Math.max(0,G.round-1);commit();return}
    if(act==='start'){G.status='running';G.pausedAt=0;
      if(G.intro){G.introAt=t0+1500;G.startAt=G.introAt+INTRO_MS+GO_MS;adminNote=['ok','시작했습니다. 모든 방에서 인트로 영상이 나오고 있습니다.']}
      else{G.introAt=0;G.startAt=t0+3500;adminNote=['ok','시작했습니다. 모든 방에서 카운트다운이 시작됩니다.']}
      commit();return}
    if(act==='skip'){G.introAt=t0+600-INTRO_MS;G.startAt=t0+600+GO_MS;adminNote=['ok','영상을 건너뛰었습니다. “시작” 화면 뒤 타이머가 돌아갑니다.'];commit();return}
    if(act==='pause'){G.status='paused';G.pausedAt=t0;adminNote=['ok','모든 방을 일시 정지했습니다.'];commit();return}
    if(act==='resume'){G.startAt+=t0-G.pausedAt;G.status='running';G.pausedAt=0;adminNote=['ok','항해를 재개했습니다.'];commit();return}
    if(act==='add60'||act==='add300'){G.limit+=act==='add60'?60:300;adminNote=['ok',(act==='add60'?1:5)+'분을 더했습니다.'];commit();return}
    if(act==='end'){if(endArm<t0){endArm=t0+3000;updCtl();setTimeout(updCtl,3100);return}endArm=0;closeOut('ended');G.status='ended';G.endReason='manual';adminNote=['ok','게임을 종료했습니다.'];commit();return}
    if(act==='newid'){if(newArm<t0){newArm=t0+3000;a.textContent='한 번 더 누르면 새 번호 · 방 화면을 다시 연결해야 합니다';setTimeout(function(){a.textContent='새 게임 번호 만들기'},3000);return}
      newArm=0;G.id=newId();saveG();conns={};hostNet();updHost();return}
  });
  function startHost(){
    ls('ark-role','host');loadG();renderHost();hostNet();
    setInterval(broadcast,4000);
    var lastPh='';
    setInterval(function(){
      if(G.status==='running'&&G.limit&&Date.now()>=G.startAt+G.limit*1000){closeOut('timeout');G.status='ended';G.endReason='time';commit()}
      var ph=hPhase();if(ph!==lastPh){lastPh=ph;updHost()}else updHClock();
    },250);
    setInterval(function(){var t=Date.now();Object.keys(conns).forEach(function(k){if(t-conns[k].last>20000){try{conns[k].conn.close()}catch(e){}delete conns[k]}});for(var r=1;r<=G.rooms;r++)updRoomCard(r)},2000);
  }

  /* ---------- shared: gate, keys, rain, sound, clock ---------- */
  var gate=null;
  function updGate(){
    var want=role==='room'&&!armed;
    if(want&&!gate){
      gate=document.createElement('div');gate.className='gate';gate.setAttribute('role','button');gate.tabIndex=0;
      gate.innerHTML='<div class="in"><div class="eyebrow">'+esc(ROOM?ROOM+'번 방 · 게임 '+GAME:'Room screen')+'</div><h2>방 화면 켜기</h2><p>화면을 한 번 누르면 빗소리와 효과음이 켜지고 전체 화면으로 바뀝니다. 화면이 꺼지지 않도록 절전 설정도 꺼 주세요.</p><span class="btn">방 화면 시작</span></div>';
      gate.addEventListener('click',arm);gate.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();arm()}});
      document.body.appendChild(gate);
    }else if(!want&&gate){gate.remove();gate=null}
  }
  function arm(){
    armed=true;audioStart();
    try{var de=document.documentElement;if(de.requestFullscreen)de.requestFullscreen().catch(noop)}catch(e){}
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(noop)}catch(e){}
    updGate();if(lastPhase==='intro')syncIntro();setTimeout(sendStatus,400);
  }
  app.addEventListener('click',function(e){
    if(role!=='room')return;
    if(e.target.closest('[data-s]')){toggleSound();return}
    var k=e.target.closest('[data-k]');if(k){press(k.getAttribute('data-k'));return}
    // hidden way out for the staff: tap the title five times within two seconds
    if(e.target.closest('h1,h2')){var n=Date.now();taps=taps.filter(function(t){return n-t<2000});taps.push(n);if(taps.length>=5){taps=[];if(document.fullscreenElement)document.exitFullscreen().catch(noop);go('?join')}}
  });
  document.addEventListener('keydown',function(e){
    if(role!=='room'||gate)return;
    var k=/^\d$/.test(e.key)?e.key:e.key==='Backspace'?'del':e.key==='Enter'?'go':null;
    if(!k)return;e.preventDefault();
    var b=app.querySelector('[data-k="'+k+'"]');if(b){b.classList.add('press');setTimeout(function(){b.classList.remove('press')},90)}
    press(k);
  });
  /* ---------- rain on the window: heavier as time runs out ---------- */
  var tension=0,flash=0;
  var cv=document.getElementById('rain'),cx=cv.getContext('2d'),drops=[],W,H,dp=devicePixelRatio||1;
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=cv.width=innerWidth*dp;H=cv.height=innerHeight*dp}
  size();addEventListener('resize',size);
  for(var i=0;i<420;i++)drops.push({x:Math.random(),y:Math.random(),l:.4+Math.random()*.8,v:.006+Math.random()*.01});
  var fl=document.createElement('div');fl.id='flash';document.body.appendChild(fl);
  var vg=document.createElement('div');vg.id='vig';document.body.appendChild(vg);
  function rainFrame(now){
    var t=(now||0)/1000,n=Math.round(140+280*tension),sp=1+1.6*tension,wind=.25+.45*tension;
    cx.clearRect(0,0,W,H);
    cx.strokeStyle='rgba(159,176,178,'+(.2+.12*tension)+')';cx.lineWidth=dp*(1+tension*.6);cx.beginPath();
    for(var i=0;i<n;i++){var d=drops[i],x=d.x*W,y=d.y*H,L=d.l*(18+16*tension)*dp;cx.moveTo(x,y);cx.lineTo(x-L*wind,y+L);
      if(!still){d.y+=d.v*sp;d.x-=d.v*sp*wind;if(d.y>1){d.y=-.05;d.x=Math.random()*1.3}}}
    cx.stroke();
    // flood water rising from the bottom
    if(role==='room'&&R&&limitMs()&&(lastPhase==='running'||lastPhase==='paused')){
      var lvl=H*(1-(.03+.34*tension)),amp=(4+14*tension)*dp;
      for(var layer=0;layer<3;layer++){
        cx.beginPath();cx.moveTo(0,H);
        for(var x=0;x<=W+20;x+=16*dp){cx.lineTo(x,lvl+layer*10*dp+Math.sin(x/(90*dp)+t*(1.2+layer*.4)*(1+tension)+layer*2)*amp+Math.sin(x/(37*dp)-t*1.7)*amp*.35)}
        cx.lineTo(W,H);cx.closePath();
        cx.fillStyle=['rgba(40,90,105,.32)','rgba(24,60,72,.42)','rgba(10,30,38,.6)'][layer];cx.fill();
      }
    }
    if(flash>0){fl.style.opacity=String(Math.min(.75,flash));flash*=.86;if(flash<.01){flash=0;fl.style.opacity='0'}}
    if(!still)requestAnimationFrame(rainFrame);
  }
  rainFrame(0);

  /* ---------- sound: synthesized rain, thunder, heartbeat, distant cries ---------- */
  var AC=null,master,verb,hissG,bodyG,noiseBuf,brownBuf,droneG,droneF,soundOn=ls('ark-sound')!=='off';
  function live(){return !!(AC&&AC.state==='running')}
  function soundLabel(){return soundOn&&live()?'빗소리 끄기':'빗소리 켜기'}
  function updSnd(){var b=document.getElementById('snd');if(b)b.textContent=soundLabel()}
  function audioStart(){
    if(!soundOn||role!=='room')return;
    if(AC){if(AC.state!=='running')AC.resume().then(function(){updSnd();sendStatus()},noop);return}
    try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
    var sr=AC.sampleRate,len=sr*3,i;
    noiseBuf=AC.createBuffer(1,len,sr);var nd=noiseBuf.getChannelData(0);for(i=0;i<len;i++)nd[i]=Math.random()*2-1;
    brownBuf=AC.createBuffer(1,sr*10,sr);var bd=brownBuf.getChannelData(0),last=0;
    for(i=0;i<bd.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;bd[i]=last*3.5}
    // a limiter keeps the loudest thunder from clipping
    var comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.35;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=0;master.connect(comp);
    master.gain.linearRampToValueAtTime(.9,AC.currentTime+3);
    // a wide, dark hall: thunder rolls in it and far-off voices drift through it
    var ir=AC.createBuffer(2,sr*3.5,sr);
    for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch);for(i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.6)}
    verb=AC.createConvolver();verb.buffer=ir;var vw=AC.createGain();vw.gain.value=.45;verb.connect(vw);vw.connect(master);
    function loop(type,freq,gain,off){var s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
      var f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;var g=AC.createGain();g.gain.value=gain;
      s.connect(f);f.connect(g);g.connect(master);s.start(0,off);return g}
    hissG=loop('highpass',1600,.05,0);bodyG=loop('lowpass',650,.12,1.3);
    var lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=.025;lfo.connect(lg);lg.connect(hissG.gain);lfo.start();
    // a low drone that swells through the final minute
    droneF=AC.createBiquadFilter();droneF.type='lowpass';droneF.frequency.value=110;droneG=AC.createGain();droneG.gain.value=0;
    [55,55.7,82.4,41.2].forEach(function(f){var o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(droneF);o.start()});
    droneF.connect(droneG);droneG.connect(master);
    dropLoop();updSnd();
  }
  function dropLoop(){
    if(!AC)return;
    if(AC.state==='running'){
      var now=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
      var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*5200;f.Q.value=6+Math.random()*6;
      var g=AC.createGain(),pk=(.015+Math.random()*.05)*(1+tension);
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(pk,now+.004);g.gain.exponentialRampToValueAtTime(.0001,now+.05+Math.random()*.05);
      s.connect(f);f.connect(g);g.connect(master);s.start(now,Math.random()*2.5,.12);
    }
    setTimeout(dropLoop,(30+Math.random()*110)/(1+tension*2.5));
  }
  var ducked=false;
  function duck(on){ducked=on;if(AC&&master)master.gain.setTargetAtTime(on?0.12:0.9,AC.currentTime,0.8)}
  function setRain(){
    if(!AC||!hissG)return;var now=AC.currentTime;
    hissG.gain.setTargetAtTime(.05+.13*tension,now,1.5);bodyG.gain.setTargetAtTime(.12+.2*tension,now,1.5);
  }
  function setDrone(x){
    if(!AC||!droneG)return;var n=AC.currentTime;
    droneG.gain.setTargetAtTime(x>0?.05+.16*x:0,n,x>0?.8:.3);droneF.frequency.setTargetAtTime(110+700*x*x,n,.8);
  }
  function toggleSound(){
    if(soundOn&&live()){soundOn=false;ls('ark-sound','off');AC.suspend().then(function(){updSnd();sendStatus()},updSnd);return}
    soundOn=true;ls('ark-sound','on');audioStart();
  }
  // route a node to the dry mix and, optionally, the hall
  function send(node,dry,wet){var d=AC.createGain();d.gain.value=dry;node.connect(d);d.connect(master);if(wet){var w=AC.createGain();w.gain.value=wet;node.connect(w);w.connect(verb)}}
  function tone(type,freq,at,vol,dur){if(!live())return;var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.015);g.gain.exponentialRampToValueAtTime(.001,at+dur);o.connect(g);g.connect(master);o.start(at);o.stop(at+dur+.05)}
  // one voice crying out somewhere beyond the walls; far = 0 (near) … 1 (very far)
  function scream(far){
    if(!live())return;
    var n=AC.currentTime+Math.random()*.3,female=Math.random()<.55,f0=female?540+Math.random()*360:290+Math.random()*170,dur=.7+Math.random()*1.2;
    var o=AC.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(f0*.78,n);o.frequency.linearRampToValueAtTime(f0*1.12,n+.16);o.frequency.linearRampToValueAtTime(f0,n+dur*.6);o.frequency.linearRampToValueAtTime(f0*.6,n+dur);
    var vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=5+Math.random()*3;vg.gain.value=f0*.04;vib.connect(vg);vg.connect(o.frequency);
    var mix=AC.createGain();mix.gain.value=3.2;
    // vowel “ah”: three formant bands
    [[female?950:760,4,1],[female?1450:1180,5,.6],[female?2950:2600,6,.3]].forEach(function(F){var b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=F[0];b.Q.value=F[1];var g=AC.createGain();g.gain.value=F[2];o.connect(b);b.connect(g);g.connect(mix)});
    var br=AC.createBufferSource();br.buffer=noiseBuf;var bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.value=2400;bf.Q.value=1;var bg=AC.createGain();bg.gain.value=.12;br.connect(bf);bf.connect(bg);bg.connect(mix);
    var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3400-far*2000;
    var env=AC.createGain(),vol=.2-far*.13;
    env.gain.setValueAtTime(0,n);env.gain.linearRampToValueAtTime(vol,n+.07);env.gain.setValueAtTime(vol,n+dur*.7);env.gain.exponentialRampToValueAtTime(.001,n+dur+.3);
    mix.connect(lp);lp.connect(env);var out=env;
    if(AC.createStereoPanner){var pan=AC.createStereoPanner();pan.pan.value=Math.random()*1.6-.8;env.connect(pan);out=pan}
    send(out,.55,1.3);
    o.start(n);vib.start(n);br.start(n,Math.random()*2,dur+.4);o.stop(n+dur+.35);vib.stop(n+dur+.35);
  }
  function crowd(k,far){for(var i=0;i<k;i++)setTimeout(function(){scream(far)},Math.random()*1800)}
  var sfx={
    // power 0.1 (far grumble) … 1.6 (directly overhead)
    thunder:function(power){
      if(!live())return;var n=AC.currentTime,p=Math.max(.1,power);
      if(p>.55){ // the tearing crack of a close strike
        var c=AC.createBufferSource();c.buffer=noiseBuf;var hf=AC.createBiquadFilter();hf.type='highpass';hf.frequency.value=800;var cg=AC.createGain();
        cg.gain.setValueAtTime(0,n);cg.gain.linearRampToValueAtTime(.55*p,n+.004);cg.gain.exponentialRampToValueAtTime(.3*p,n+.06);cg.gain.exponentialRampToValueAtTime(.001,n+.45);
        c.connect(hf);hf.connect(cg);send(cg,1,.7);c.start(n,Math.random()*2,.6);
      }
      // the rumble, rolling a few times as it travels
      var r=AC.createBufferSource();r.buffer=brownBuf;var lf=AC.createBiquadFilter();lf.type='lowpass';lf.frequency.value=150+p*420;
      var rg=AC.createGain(),pk=.45+p*1.25,len=3+p*4.5;
      rg.gain.setValueAtTime(0,n);rg.gain.linearRampToValueAtTime(pk,n+.03+Math.random()*.12);
      for(var k=1;k<6;k++)rg.gain.setTargetAtTime(pk*(.3+Math.random()*.7)*(1-k/7),n+k*len/7+Math.random()*.25,.12);
      rg.gain.setTargetAtTime(.0001,n+len*.8,len*.15);
      r.connect(lf);lf.connect(rg);send(rg,1,.55);r.start(n,Math.random()*1.5,len+1);
      if(p>.4){ // a sub-bass blow you feel in the floor
        var o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.setValueAtTime(62,n);o.frequency.exponentialRampToValueAtTime(26,n+1.3);
        og.gain.setValueAtTime(0,n);og.gain.linearRampToValueAtTime(.75*Math.min(p,1.4),n+.025);og.gain.exponentialRampToValueAtTime(.001,n+1.8);o.connect(og);og.connect(master);o.start(n);o.stop(n+1.9);
      }
    },
    mega:function(){if(!live())return;sfx.thunder(1.6);setTimeout(function(){sfx.thunder(1.2)},650)},
    thump:function(at,freq,vol){if(!live())return;var o=AC.createOscillator(),g=AC.createGain();o.type='sine';
      o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(freq*.55,at+.18);
      g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.012);g.gain.exponentialRampToValueAtTime(.001,at+.3);
      o.connect(g);g.connect(master);o.start(at);o.stop(at+.35)},
    heart:function(vol){if(!live())return;var n=AC.currentTime;sfx.thump(n,72,vol);sfx.thump(n+.2,58,vol*.7)},
    tick:function(){if(!live())return;tone('triangle',1500,AC.currentTime,.12,.06)},
    beep:function(n){if(!live())return;tone('sine',n<=1?880:660,AC.currentTime,.18,.35)},
    bell:function(){if(!live())return;var n=AC.currentTime;tone('sine',987.8,n,.14,2.2);tone('sine',1318.5,n+.18,.11,2.6)},
    slam:function(){if(!live())return;var n=AC.currentTime;sfx.thump(n,55,.9);sfx.thump(n+.05,110,.5)},
    thud:function(){if(!live())return;sfx.thump(AC.currentTime,120,.5)},
    win:function(){if(!live())return;var n=AC.currentTime;setDrone(0);hissG.gain.setTargetAtTime(.01,n,1.2);bodyG.gain.setTargetAtTime(.02,n,1.2);
      [523.25,659.25,783.99,1046.5,1318.5].forEach(function(fq,i){tone('sine',fq,n+1.8+i*.32,.12,4)})},
    drown:function(){if(!live())return;setDrone(0);sfx.mega();crowd(5,.25);var n=AC.currentTime;hissG.gain.setTargetAtTime(.28,n,.4);bodyG.gain.setTargetAtTime(.5,n,.4);
      hissG.gain.setTargetAtTime(.03,n+4,2);bodyG.gain.setTargetAtTime(.08,n+4,2)}
  };
  function strike(power){flash=.35+Math.min(power,1)*.5;setTimeout(function(){sfx.thunder(power)},180+Math.random()*(1-Math.min(power,1))*1500)}
  function quake(){app.classList.remove('quake');void app.offsetWidth;app.classList.add('quake')}
  ['pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.target.closest&&e.target.closest('[data-s]'))return;if(armed)audioStart()},true)});

  /* ---------- the room's clock drives the tension ---------- */
  var lastSec=-1,lastCount=-1;
  if(role==='room')setInterval(function(){
    if(!R)return;
    var ph=phase();
    if(ph!==lastPhase){var prev=lastPhase;renderRoom();onPhase(prev,ph);sendStatus()}
    var c=document.getElementById('clock');if(c)c.textContent=mmss(remaining());
    if(ph==='intro')syncIntro();
    if(ph==='countdown'){
      var n=Math.max(1,Math.ceil((S.startAt-now())/1000));
      if(n!==lastCount){lastCount=n;var cn=document.getElementById('cnum');if(cn){cn.textContent=n;cn.style.animation='none';void cn.offsetHeight;cn.style.animation=''}sfx.beep(n)}
    }else lastCount=-1;
    var L=limitMs(),playing=ph==='running'&&L>0,rem=remaining();
    tension=playing?Math.max(0,Math.min(1,1-rem/L)):(ph==='paused'?tension:tension*.95);
    var urgent=playing&&rem<=60000,fin=playing&&rem<=10000;
    document.body.className=playing?((tension>=.75?'warn ':'')+(urgent?'urgent ':'')+(fin?'final':'')):'';
    vg.style.opacity=playing?String(urgent?.55+.45*(1-rem/60000):tension>=.75?.25:0):'0';
    setRain();
    if(playing){
      var sec=Math.ceil(rem/1000);
      if(sec!==lastSec){lastSec=sec;
        if(urgent)sfx.heart(fin?.9:.55);
        if(fin)sfx.tick();
        if(fin&&sec%3===0){strike(1.1);quake()}
      }
      if(Math.random()<(urgent?.025:tension>.6?.008:.002))strike(urgent?.8+Math.random()*.6:.15+tension*.7);
      // people outside the ark: a faint cry now and then, more and nearer as the water rises
      var cry=fin?.06:urgent?.03:tension>.75?.012:tension>.5?.004:0;
      if(Math.random()<cry){if(urgent&&Math.random()<.4)crowd(2+(Math.random()*3|0),.15+Math.random()*.35);else scream(.35+Math.random()*.55*(1-tension))}
      setDrone(urgent?1-rem/60000:0);
    }else{setDrone(0);if(ph!=='solved'&&ph!=='go'&&Math.random()<.0015)strike(.15)}
  },250);

  if(role==='host')startHost();
  else if(role==='room'&&GAME&&ROOM)startRoom();
  else if(role==='join'||role==='room')renderJoin();
  else renderHome();
})();
</script>
